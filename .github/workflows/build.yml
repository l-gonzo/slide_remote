# Compila Zlide en los servidores de GitHub para todos los sistemas.
#  - En cada push a main y en cada pull request: compila y deja los archivos en "Artifacts".
#  - Al subir una etiqueta v* (git tag v2.0.0 && git push --tags): además crea un Release con
#    los instaladores (.apk, .deb, .tar.gz, .exe, .zip, .dmg).
#
# Firma de Android (opcional), en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64 (base64 del .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: LibreOffice para Android (si está en el release)
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', SLIDE_REMOTE_REPO: '${{ github.repository }}' }
        run: python3 tool/libreoffice_android.py fetch
      - name: Firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tool/configure.py
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            python3 tool/configure.py
          fi
      - run: python3 tool/build.py android
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: python3 tool/build.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: python tool/build.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: python3 tool/build.py macos
      - name: iPhone (comprobar que compila; sin firma)
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Instaladores de escritorio en el repositorio público de descargas (sin código):
  # https://github.com/l-gonzo/zlide_desktop — es el enlace de Ajustes › App para PC.
  # Con nombres fijos, así los enlaces .../releases/latest/download/<archivo> no cambian
  # de una versión a otra. Necesita el secreto DESKTOP_RELEASE_TOKEN (token de GitHub con
  # permiso "Contents: Read and write" solo en l-gonzo/zlide_desktop).
  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
    steps:
      - name: ¿Hay token?
        if: env.TOKEN == ''
        run: echo "::warning::Falta el secreto DESKTOP_RELEASE_TOKEN; no se publicó en l-gonzo/zlide_desktop."
      - uses: actions/download-artifact@v4
        if: env.TOKEN != ''
        with: { path: dist, merge-multiple: true, pattern: '{linux,windows,macos}' }
      - name: Nombres fijos
        if: env.TOKEN != ''
        run: |
          set -e
          mkdir out
          cp dist/*.exe                 out/Zlide-Windows-Setup.exe
          cp dist/*-windows-x64.zip     out/Zlide-Windows-portable.zip
          cp dist/*.dmg                 out/Zlide-macOS.dmg
          cp dist/*_amd64.deb           out/Zlide-Linux-amd64.deb
          cp dist/*_linux-amd64.tar.gz  out/Zlide-Linux-amd64.tar.gz
          ls -l out
      - uses: softprops/action-gh-release@v2
        if: env.TOKEN != ''
        with:
          repository: l-gonzo/zlide_desktop
          token: ${{ env.TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Zlide para escritorio ${{ github.ref_name }}
          make_latest: true
          files: out/*
          body: |
            **Descarga el de tu sistema / Download for your system:**
            - **Windows 10/11:** `Zlide-Windows-Setup.exe` (instalador) o `Zlide-Windows-portable.zip`
            - **macOS:** `Zlide-macOS.dmg` (ábrelo y arrastra Zlide a Aplicaciones)
            - **Linux:** `Zlide-Linux-amd64.deb` (Ubuntu, Debian, Mint…) o `Zlide-Linux-amd64.tar.gz`

            Instrucciones / Instructions: https://github.com/l-gonzo/zlide_desktop#readme
