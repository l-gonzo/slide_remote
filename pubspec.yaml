name: slide_remote
description: Zlide — cambia las diapositivas con los botones de volumen del teléfono.
publish_to: none
version: 2.5.0+7

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:     # textos propios de Flutter en español/inglés
    sdk: flutter

  # Código nativo propio: teclado Bluetooth (Android), BLE y volumen (iOS)
  slide_native:
    path: packages/slide_native

  bonsoir: ^7.1.5           # descubrimiento de la PC en la red (mDNS/Bonjour)
  universal_ble: ^2.3.0     # BLE en la app de escritorio (iPhone → PC)
  file_picker: ^13.1.0      # elegir el PDF del modo Navegador
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0
  ffi: ^2.1.0               # teclas en la PC (SendInput / CGEventPost / uinput)
  archive: ">=3.6.0 <5.0.0" # leer el .pptx (es un ZIP) para las notas
  xml: ">=6.5.0 <8.0.0"     # leer las notas dentro del .pptx

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/icon/logo.png
    - assets/fonts/OFL-Atkinson.txt
    - assets/fonts/OFL-AtkinsonMono.txt
    - assets/fonts/OFL-Bricolage.txt

  # Tipografías (OFL; licencias en assets/fonts). Instancias estáticas de las fuentes variables.
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700
    - family: ZlideDisplay
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Display.ttf
          weight: 800
    - family: ZlideHeadline
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Headline.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: assets/icon/icon_ios.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
