<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zlide</title>
<style>
  :root {
    --bg: #000; --panel: rgba(31, 26, 24, .88); --stroke: #3b322e;
    --text: #f7f1ed; --muted: #b4a69e; --accent: #f26522; --ok: #3fd48a; --busy: #ffc24b; --off: #6f635c;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #wrap { position: relative; }
  #ink, #live { position: absolute; left: 0; top: 0; pointer-events: none; }
  #laser { position: absolute; left: 0; top: 0; display: none; border-radius: 50%; pointer-events: none;
    will-change: transform; }
  #empty { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; background: #141110; }
  #empty.show { display: flex; }
  #empty h1 { margin: 0; font-size: clamp(28px, 5vw, 56px); font-weight: 800; letter-spacing: -.02em; }
  #empty p { margin: 0; color: var(--muted); font-size: clamp(15px, 2vw, 20px); max-width: 32em; line-height: 1.45; }
  #empty .mark { width: 72px; height: 72px; border-radius: 20px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 40px; font-weight: 900; }
  #hud { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
    font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--stroke);
    padding: 8px 8px 8px 14px; border-radius: 999px; transition: opacity .35s; backdrop-filter: blur(8px); }
  #hud .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  #hud.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #hud.busy .dot { background: var(--busy); }
  #pg { color: var(--text); font-variant-numeric: tabular-nums; }
  #fs { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 999px;
    padding: 7px 14px; font-weight: 700; cursor: pointer; }
  body.idle #hud { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  :fullscreen #fs { display: none; }
  #fs:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><canvas id="ink"></canvas><canvas id="live"></canvas><div id="laser"></div></div></div>
<div id="empty" class="show">
  <div class="mark">▶</div>
  <h1>Zlide</h1>
  <p id="emptyMsg">Conectando con el teléfono…</p>
</div>
<div id="hud" class="busy">
  <span class="dot"></span>
  <span id="st">Conectando…</span>
  <span id="pg"></span>
  <button id="fs" type="button">Pantalla completa</button>
</div>

<script type="module">
  import * as pdfjsLib from '/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const st = document.getElementById('st');
  const pg = document.getElementById('pg');
  const empty = document.getElementById('empty');
  const emptyMsg = document.getElementById('emptyMsg');
  const fsBtn = document.getElementById('fs');
  const inkCanvas = document.getElementById('ink');
  const inkCtx = inkCanvas.getContext('2d');

  // ------------------------------------------------------------ idioma (el de la app del teléfono)
  const TXT = {
    es: {
      connecting: 'Conectando…', connectingPhone: 'Conectando con el teléfono…',
      pickPdf: 'Elige una presentación en la app del teléfono.', cantOpen: 'No se pudo abrir el PDF.',
      connected: 'Teléfono conectado', reconnecting: 'Reconectando con el teléfono…', fullscreen: 'Pantalla completa',
      pickPdfPc: 'Elige la presentación en Zlide para escritorio y toca “Proyectar en esta PC”.',
      connectedPc: 'Conectado', reconnectingPc: 'Reconectando…',
    },
    en: {
      connecting: 'Connecting…', connectingPhone: 'Connecting to the phone…',
      pickPdf: 'Choose a presentation in the phone app.', cantOpen: 'Could not open the PDF.',
      connected: 'Phone connected', reconnecting: 'Reconnecting to the phone…', fullscreen: 'Full screen',
      pickPdfPc: 'Choose the presentation in Zlide for desktop and click “Present on this computer”.',
      connectedPc: 'Connected', reconnectingPc: 'Reconnecting…',
    },
  };
  let lang = document.documentElement.lang === 'es' ? 'es' : 'en';
  let hudKey = 'connecting', emptyKey = 'connectingPhone';
  // Servida por la app de escritorio ("Proyectar en esta PC") en vez del teléfono
  let fromPc = false;
  const T = (k) => { const d = TXT[lang] || TXT.en; return (fromPc && d[k + 'Pc']) || d[k] || k; };
  function applyLang() {
    document.documentElement.lang = lang;
    st.textContent = T(hudKey);
    emptyMsg.textContent = T(emptyKey);
    fsBtn.textContent = T('fullscreen');
  }
  applyLang();

  let doc = null, page = 1, total = 0, ws = null, loading = false;
  let shown = 0, rendering = false;
  const cache = new Map(); // "página@ancho x alto" -> canvas ya renderizado

  // ------------------------------------------------------------ PDF
  async function load() {
    if (loading) return;
    loading = true;
    try {
      const r = await fetch('/deck.pdf', { cache: 'no-store' });
      if (!r.ok) {
        doc = null; total = 0; cache.clear();
        showEmpty('pickPdf');
        report();
        return;
      }
      const data = new Uint8Array(await r.arrayBuffer());
      doc = await pdfjsLib.getDocument({ data }).promise;
      total = doc.numPages;
      page = Math.min(Math.max(page, 1), total);
      cache.clear(); shown = 0;
      empty.classList.remove('show');
      await show();
    } catch (e) {
      console.error(e);
      showEmpty('cantOpen');
    } finally {
      loading = false;
    }
  }

  function showEmpty(key) {
    emptyKey = key;
    emptyMsg.textContent = T(key);
    empty.classList.add('show');
    pg.textContent = '';
  }

  function sizeKey(n) {
    return `${n}@${innerWidth}x${innerHeight}x${devicePixelRatio || 1}`;
  }

  async function renderPage(n) {
    const key = sizeKey(n);
    if (cache.has(key)) return cache.get(key);
    const p = await doc.getPage(n);
    const base = p.getViewport({ scale: 1 });
    const scale = Math.min(innerWidth / base.width, innerHeight / base.height);
    const dpr = devicePixelRatio || 1;
    const vp = p.getViewport({ scale: scale * dpr });
    const off = document.createElement('canvas');
    off.width = Math.floor(vp.width);
    off.height = Math.floor(vp.height);
    await p.render({ canvasContext: off.getContext('2d'), viewport: vp }).promise;
    cache.set(key, off);
    if (cache.size > 6) cache.delete(cache.keys().next().value);
    return off;
  }

  async function show() {
    if (!doc) return;
    if (rendering) return; // al terminar se vuelve a llamar si cambió la página
    rendering = true;
    try {
      while (shown !== page) {
        const target = page;
        const off = await renderPage(target);
        if (target !== page) continue; // cambió mientras renderizaba
        const dpr = devicePixelRatio || 1;
        canvas.width = off.width;
        canvas.height = off.height;
        canvas.style.width = (off.width / dpr) + 'px';
        canvas.style.height = (off.height / dpr) + 'px';
        ctx.drawImage(off, 0, 0);
        for (const c of [inkCanvas, liveCanvas]) {
          c.width = off.width;
          c.height = off.height;
          c.style.width = canvas.style.width;
          c.style.height = canvas.style.height;
        }
        shown = target;
        drawInk();
        pg.textContent = `${page} / ${total}`;
        report();
      }
    } finally {
      rendering = false;
    }
    // Pre-renderizar la siguiente para que el cambio sea instantáneo
    if (page < total) renderPage(page + 1).catch(() => {});
  }

  function go(d) {
    if (!doc) return;
    const n = Math.min(Math.max(page + d, 1), total);
    if (n === page) return;
    page = n;
    show();
  }

  // ------------------------------------------------------------ teléfono
  function setHud(state, key) {
    hud.className = state;
    hudKey = key;
    st.textContent = T(key);
  }

  // El teléfono decide la página: este navegador solo pide cambios y muestra lo que le digan.
  // Así todas las pantallas abiertas en la dirección van sincronizadas.
  function online() { return ws && ws.readyState === WebSocket.OPEN; }

  function nav(d) {
    if (online()) ws.send(JSON.stringify({ t: 'nav', d }));
    else go(d); // sin teléfono: navegar aquí mismo
  }

  function navTo(n) {
    if (online()) ws.send(JSON.stringify({ t: 'nav', page: n }));
    else if (doc) { page = Math.min(Math.max(n, 1), total); show(); }
  }

  function setPage(n) {
    if (!n) return;
    page = doc ? Math.min(Math.max(n, 1), total) : n;
    if (doc) show();
  }

  function report() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ t: 'state', page: doc ? page : 0, total }));
    }
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { setHud('on', 'connected'); report(); };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === 'page') setPage(msg.page);
      else if (msg.t === 'go') go(msg.d); // versión anterior de la app
      else if (msg.t === 'reload') load(); // se queda en la misma página (la corrige el teléfono/la PC)
      else if (msg.t === 'ink') onInk(msg);
      else if (msg.t === 'inkAll') {
        inkPages.clear();
        for (const [k, v] of Object.entries(msg.pages || {})) inkPages.set(Number(k), v);
        drawInk();
      }
      else if (msg.t === 'laser') onLaser(msg);
      else if (msg.t === 'lang') { lang = msg.lang === 'es' ? 'es' : 'en'; applyLang(); }
      else if (msg.t === 'hello') {
        if (msg.lang && msg.lang !== lang) { lang = msg.lang === 'es' ? 'es' : 'en'; applyLang(); }
        if (msg.src === 'pc' && !fromPc) { fromPc = true; applyLang(); }
        if (msg.page) setPage(msg.page);
        if (msg.hasPdf && !doc) load();
        else if (!msg.hasPdf) showEmpty('pickPdf');
      }
    };
    ws.onclose = () => {
      setHud('busy', 'reconnecting');
      setTimeout(connect, 1500);
    };
  }

  // ------------------------------------------------------------ dibujos desde el teléfono
  // Coordenadas de 0 a 1 respecto a la página; grosor como fracción del ancho.
  //
  // Fluidez: los mensajes que traen `ts` (cuándo se tocó, en el reloj del teléfono) se muestran
  // con un retraso pequeño y su ritmo original, así no se notan los tirones de la red. Si la red
  // se atrasa más que eso, el reloj de reproducción se frena en vez de detenerse y luego acelera
  // un poco hasta ponerse al día: el movimiento cambia de velocidad, pero no salta. Los
  // trazos terminados se pintan una sola vez en #ink; en #live solo los que se están dibujando,
  // y el láser es un elemento aparte que mueve la tarjeta gráfica sin repintar nada.
  // Sin `ts` (versión anterior de la app) se muestran en cuanto llegan.
  const liveCanvas = document.getElementById('live');
  const liveCtx = liveCanvas.getContext('2d');
  const laserEl = document.getElementById('laser');
  const inkPages = new Map(); // página -> [{id, tool, color, w, pts: [x, y, x, y, …], _t: [ts por punto]}]
  let laser = null; // {page, x, y, s (tamaño)}: lo que se ve ahora
  const laserQ = []; // {t, page, x, y, s, off}: lo que falta mostrar
  let committed = 0; // trazos de la página mostrada ya pintados en #ink

  // Reloj de reproducción, en la hora del teléfono
  let base = null; // mínimo de (llegada − ts): diferencia de relojes más la red en su mejor momento
  let jitter = 8; // ms: cuánto se atrasan en promedio los mensajes respecto al más rápido
  let latest = -Infinity; // ts más reciente recibido
  let playT = null; // lo que se muestra ahora
  let playAt = 0; // performance.now() de la última actualización de playT

  function ideal() { return performance.now() - base - Math.min(Math.max(jitter * 1.5 + 8, 12), 50); }

  function arrived(ts) {
    const d = performance.now() - ts;
    if (base === null || d - base > 1000) { base = d; playT = null; } // > 1 s: el teléfono reinició su reloj
    else if (d < base) base = d;
    jitter += (d - base - jitter) * 0.05;
    // El teléfono manda cada ~12 ms mientras el dedo se mueve. Un hueco mayor es que el dedo
    // estuvo quieto: no hay nada que mostrar en ese tramo, el reloj puede saltarlo.
    if (playT !== null && ts - latest > 60 && playT >= latest - 1) playT = Math.max(playT, Math.min(ideal(), ts));
    if (ts > latest) latest = ts;
  }

  function playTime() {
    if (base === null) return Infinity;
    const now = performance.now();
    const target = ideal();
    if (playT === null || target - playT > 400) {
      playT = Math.min(target, latest); // primera vez, o un atraso tan largo que ya no vale la pena alcanzarlo
    } else if (playT < latest) {
      // Más rápido si se quedó atrás, más lento si se adelantó; nunca más allá de lo recibido
      const rate = Math.min(Math.max(1 + (target - playT) / 120, 0.5), 2);
      // Sin cuadros mientras no llega nada: no contar ese tiempo de golpe
      playT = Math.min(playT + Math.min(now - playAt, 34) * rate, latest);
    } // si no hay nada más reciente, se queda donde está hasta que llegue
    playAt = now;
    return playT;
  }

  let raf = 0;
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  /// Todo de nuevo (cambio de página, deshacer, borrar, reconexión).
  function drawInk() {
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    committed = 0;
    kick();
  }

  // Un trazo pasa a #ink cuando ya se mostró entero y lleva un rato sin puntos nuevos
  function settled(s, pt) {
    return !s._t || !s._t.length || (pt >= s._t[s._t.length - 1] && performance.now() - s._seen > 500);
  }

  function visible(s, pt) {
    if (!s._t) return s.pts.length / 2;
    let n = s._t.length;
    while (n > 0 && s._t[n - 1] > pt) n--;
    return n;
  }

  function frame() {
    raf = 0;
    const pt = playTime();
    let busy = false;

    // Láser: posición interpolada entre los dos mensajes que rodean al reloj
    while (laserQ.length) {
      while (laserQ.length > 1 && laserQ[1].t <= pt) laserQ.shift();
      const a = laserQ[0];
      if (a.t > pt) break;
      if (a.off) { laser = null; laserQ.shift(); continue; }
      const b = laserQ[1];
      if (b && !b.off && b.page === a.page) {
        const k = (pt - a.t) / (b.t - a.t);
        laser = { page: a.page, s: b.s, x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
      } else {
        laser = a;
      }
      break;
    }
    if (laserQ.length && laserQ[laserQ.length - 1].t > pt) busy = true;
    placeLaser();

    // Trazos
    const W = inkCanvas.width, H = inkCanvas.height;
    if (doc && W) {
      const list = inkPages.get(shown) || [];
      // En orden, para que se encimen igual que en el teléfono
      while (committed < list.length && settled(list[committed], pt)) strokeOn(inkCtx, list[committed++], W, H);
      liveCtx.clearRect(0, 0, W, H);
      for (let i = committed; i < list.length; i++) {
        strokeOn(liveCtx, list[i], W, H, visible(list[i], pt));
        busy = true;
      }
    }
    if (busy) kick();
  }

  let laserR = 0;
  function placeLaser() {
    if (!laser || laser.page !== shown || !doc || !inkCanvas.width) {
      laserEl.style.display = 'none';
      return;
    }
    const cssW = parseFloat(inkCanvas.style.width), cssH = parseFloat(inkCanvas.style.height);
    const dpr = inkCanvas.width / cssW;
    const r = (inkCanvas.width * 0.012 + 4) * laser.s / dpr;
    if (r !== laserR) {
      laserR = r;
      laserEl.style.width = laserEl.style.height = (2 * r) + 'px';
      laserEl.style.background = 'radial-gradient(circle closest-side, #ffd0d0 0 45%, #ff2d2d 47% 100%)';
      laserEl.style.boxShadow = `0 0 ${r * 2.5}px rgba(255,45,45,.9)`;
    }
    laserEl.style.transform = `translate3d(${laser.x * cssW - r}px, ${laser.y * cssH - r}px, 0)`;
    laserEl.style.display = 'block';
  }

  function onLaser(m) {
    const q = { page: m.page, x: m.x, y: m.y, s: m.s || 1, off: !!m.off };
    if (m.ts == null) {
      laserQ.length = 0;
      laser = q.off ? null : q;
      placeLaser();
      return;
    }
    arrived(m.ts);
    q.t = m.ts;
    laserQ.push(q);
    kick();
  }

  /// [n]: cuántos puntos dibujar (los que ya tocan según el reloj).
  function strokeOn(c, s, W, H, n) {
    const p = s.pts;
    if (!p) return;
    const len = n === undefined ? p.length : Math.min(n * 2, p.length);
    if (len < 2) return;
    const hl = s.tool === 'hl';
    c.save();
    c.globalAlpha = hl ? 0.38 : 1;
    c.strokeStyle = c.fillStyle = s.color;
    c.lineWidth = Math.min(Math.max(s.w * W, 1.5), 200);
    c.lineCap = hl ? 'square' : 'round';
    c.lineJoin = 'round';
    if (len === 2) {
      c.beginPath(); c.arc(p[0] * W, p[1] * H, c.lineWidth / 2, 0, Math.PI * 2); c.fill();
    } else {
      c.beginPath();
      c.moveTo(p[0] * W, p[1] * H);
      for (let i = 2; i < len - 2; i += 2) {
        const mx = (p[i] + p[i + 2]) / 2, my = (p[i + 1] + p[i + 3]) / 2;
        c.quadraticCurveTo(p[i] * W, p[i + 1] * H, mx * W, my * H);
      }
      c.lineTo(p[len - 2] * W, p[len - 1] * H);
      c.stroke();
    }
    c.restore();
  }

  function onInk(m) {
    const list = inkPages.get(m.page) || [];
    if (m.op === 'add') {
      const s = m.s;
      list.push(s);
      inkPages.set(m.page, list);
      if (m.ts != null) {
        arrived(m.ts);
        s._t = new Array(s.pts.length / 2).fill(m.ts);
        s._seen = performance.now();
      }
      if (m.page === shown) kick();
      return;
    }
    if (m.op === 'pts') {
      let i = list.length - 1;
      while (i >= 0 && list[i].id !== m.id) i--;
      if (i < 0) return;
      const s = list[i];
      if (s._t) {
        // Los puntos de un mensaje se tocaron entre el mensaje anterior y `ts`
        const prev = s._t.length ? s._t[s._t.length - 1] : (m.ts ?? 0);
        const ts = m.ts ?? prev;
        if (m.ts != null) arrived(m.ts);
        const n = m.pts.length / 2;
        for (let k = 1; k <= n; k++) s._t.push(prev + (ts - prev) * k / n);
        s._seen = performance.now();
      }
      s.pts.push(...m.pts);
      if (m.page !== shown) return;
      if (i < committed) drawInk(); // siguió un trazo que ya se daba por terminado
      else kick();
      return;
    }
    if (m.op === 'undo') list.pop();
    else if (m.op === 'clear') inkPages.delete(m.page);
    else if (m.op === 'clearAll') inkPages.clear();
    if (m.page === shown || m.op === 'clearAll') drawInk();
  }

  // ------------------------------------------------------------ teclado, clic, pantalla completa
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { nav(1); e.preventDefault(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(e.key)) { nav(-1); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'Home') navTo(1);
    else if (e.key === 'End' && doc) navTo(total);
  });

  document.getElementById('stage').addEventListener('click', (e) => {
    nav(e.clientX < innerWidth / 3 ? -1 : 1);
  });

  document.getElementById('fs').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFullscreen();
  });

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }

  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* opcional */ }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { cache.clear(); shown = 0; show(); }, 120);
  });

  let idleTimer = 0;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
  addEventListener('mousemove', wake);
  wake();
  keepAwake();
  connect();
</script>
</body>
</html>
